[build-system]
requires = ["hatchling"]          # ← 改成这个
build-backend = "hatchling.build" # ← 改成这个

[project]
name = "xqishell"
version = "0.1.0"
description = "Quantum Computing Compiler and Simulator"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{ name = "kerpers34-a11y", email = "kerpers34@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0,<4.0",
    "mdurl>=0.1,<1.0",
    "numpy>=2.1,<3.0",
    "prompt_toolkit>=3.0,<4.0",
    "pyvim>=3.0,<4.0",
    "Pygments>=2.18,<3.0",
    "scipy>=1.14,<2.0",
    "wcwidth>=0.2,<1.0",
    "pyperclip==1.11.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
[project.urls]
Homepage = "https://github.com/kerpers34-a11y/Quantum_Compiler"
Repository = "https://github.com/kerpers34-a11y/Quantum_Compiler"
"Bug Tracker" = "https://github.com/kerpers34-a11y/Quantum_Compiler/issues"
[project.scripts]
xqishell = "xqishell.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Baseline 豁免(重构期间逐步收窄,只允许删除不允许新增):
#   已收窄并清零: E722 F401 F841 W292 I001 UP015 F541 B007 E741(2026-07 重构完成)
#   剩余项随后续维护逐步消解:
ignore = [
    "E501",  # line-too-long:既有若干处,随文件维护逐行消解
    "E701",  # multiple-statements-on-one-line:execute_* 中既有写法
    "B904",  # raise-without-from-inside-except:既有 10 处,随错误体系后续统一处理
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bug: 已实锤 bug 的回归测试(修复前应为红)",
]
