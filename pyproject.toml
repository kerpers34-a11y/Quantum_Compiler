[build-system]
requires = ["hatchling"]          # ← 改成这个
build-backend = "hatchling.build" # ← 改成这个

[project]
name = "xqishell"
version = "0.1.0"
description = "Quantum Computing Compiler and Simulator"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{ name = "kerpers34-a11y", email = "kerpers34@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0,<4.0",
    "mdurl>=0.1,<1.0",
    "numpy>=2.1,<3.0",
    "prompt_toolkit>=3.0,<4.0",
    "pyvim>=3.0,<4.0",
    "Pygments>=2.18,<3.0",
    "scipy>=1.14,<2.0",
    "wcwidth>=0.2,<1.0",
    "pyperclip==1.11.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
[project.urls]
Homepage = "https://github.com/kerpers34-a11y/Quantum_Compiler"
Repository = "https://github.com/kerpers34-a11y/Quantum_Compiler"
"Bug Tracker" = "https://github.com/kerpers34-a11y/Quantum_Compiler/issues"
[project.scripts]
xqishell = "xqishell.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Baseline 豁免(重构期间逐步收窄,只允许删除不允许新增):
#   Phase 2 收窄: E722(裸except) F401(未用导入) F841(未用变量) W292 I001 UP015 F541
#   Phase 3-4 收窄: E701(单行多语句) B904(except内raise缺from) E741 B007
#   随文件重写自然消解: E501(行过长)
ignore = [
    "E501",  # line-too-long:既有 12 处,随重构逐文件消解
    "E701",  # multiple-statements-on-one-line:既有 15 处
    "E722",  # bare-except:既有 5 处,Phase 2 修复
    "E741",  # ambiguous-variable-name:既有 2 处
    "W292",  # missing-newline-at-eof:既有 9 处
    "I001",  # unsorted-imports:既有 7 处,Phase 3 统一整理
    "UP015", # redundant-open-modes:既有 3 处
    "F401",  # unused-import:既有 5 处,Phase 2 清理
    "F541",  # f-string-missing-placeholders:既有 2 处
    "F841",  # unused-variable:既有 5 处,Phase 2 清理
    "B007",  # unused-loop-control-variable:既有 1 处
    "B904",  # raise-without-from-inside-except:既有 10 处,Phase 3 随错误体系统一处理
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bug: 已实锤 bug 的回归测试(修复前应为红)",
]
